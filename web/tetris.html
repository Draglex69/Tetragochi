 MP.pl.forEach(P=>{if(mpIsTouch(P.dev))return;const s=devState(P.dev),o=P.prev,E=k=>s[k]&&!o[k];P.prev=s;
  if(E('start')){mpPause(true,P.dev);return}
  if(P.dev.startsWith('kb')){['l','r','d'].forEach(k=>{if(!s[k]){P.das[k]=0;return}if(!P.das[k])P.das[k]=t+(k==='d'?60:170);else if(t>=P.das[k]){mpAct(P,k,t);P.das[k]=t+(k==='d'?45:55)}});return}
  ['l','r','d'].forEach(k=>{if(!s[k]){P.das[k]=0;return}if(!P.das[k]){mpAct(P,k,t);P.das[k]=t+(k==='d'?60:170)}else if(t>=P.das[k]){mpAct(P,k,t);P.das[k]=t+(k==='d'?45:55)}});
  ['u','cw','ccw','hold','feed','pet'].forEach(k=>{if(E(k))mpAct(P,k,t)})});
 if(!MP.paused&&!MP.ended&&t>=MP.count){
  MP.pl.forEach(P=>{if(P.happy>0)P.happy--;if(P.eat>0)P.eat--;P.belly=Math.max(0,P.belly-dt*.0007);
   if(P.finish!=null||t<P.frozen)return;
   if(P.junkAt&&t>=P.junkAt){P.junkAt=0;mpJunk(P)}
   if(!P.pc){mpSpawn(P);if(MP.ended)return}
   if(P.pc){P.grav+=dt;if(P.grav>=mpGrav(P)){P.grav=0;mpStep(P)}}
   if(P.belly<25&&!P.hungrySaid){P.hungrySaid=1;mpSay(P,'hungry')}else if(P.belly>=45)P.hungrySaid=0});
  if(MP.mode==='race'&&MP.firstFin!=null&&t-MP.firstFin>60000&&!MP.ended)mpEnd()}
 if(MP.ended&&!MP.endT)MP.endT=t;
 mpDraw(t)}

addEventListener('keydown',e=>{const c=document.getElementById('ctlov');if(c.classList.contains('on')&&e.key==='Escape'){c.classList.remove('on');e.stopImmediatePropagation()}},true);

reset();requestAnimationFrame(loop);
</script>
